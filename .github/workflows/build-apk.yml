name: Build Android APK

# Buduje instalowalny APK (debug, podpisany kluczem debug) jako artefakt do pobrania.
# Uwaga: klucz debug jest inny na kazdej maszynie - aby zaktualizowac aplikacje
# zainstalowana z innego buildu, trzeba ja wczesniej odinstalowac.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: TelePakt-Android-APK
          path: public/telepakt.apk
          retention-days: 30
