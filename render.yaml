# Render Blueprint dla TelePakt.pl
# Automatyczne utworzenie:
# 1. Bazy danych PostgreSQL (telepakt-db)
# 2. Backendu Python Django (telepakt-api)
# 3. Frontendu React SPA (telepakt-web) dla domeny telepakt.pl

services:
  # -------------------------------------------------------------
  # 1. FRONTEND: React SPA (Landing Page, Symulator, Panel Admin)
  # -------------------------------------------------------------
  - type: web
    name: telepakt-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_API_URL
        value: https://api.telepakt.pl

  # -------------------------------------------------------------
  # 2. BACKEND: Python 3.11 / Django 5 (Webhooki Twilio, DRF API)
  # -------------------------------------------------------------
  - type: web
    name: telepakt-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn telepakt_project.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/telephony/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "api.telepakt.pl,telepakt-api.onrender.com,telepakt.pl,www.telepakt.pl,localhost"
      - key: APP_BASE_URL
        value: "https://telepakt.pl"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://telepakt.pl,https://www.telepakt.pl"
      - key: DATABASE_URL
        fromDatabase:
          name: telepakt-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        value: "+48221234567"
      - key: RETENTION_DAYS
        value: "30"

# -------------------------------------------------------------
# 3. BAZA DANYCH: Zarządzany PostgreSQL dla dowodów i RODO
# -------------------------------------------------------------
databases:
  - name: telepakt-db
    region: frankfurt
    plan: free
    databaseName: telepakt_db
    user: telepakt_user
