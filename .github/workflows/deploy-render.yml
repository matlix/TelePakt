name: Deploy to Render.com

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. To enable auto-deployment, add this secret in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "Triggering deployment on Render.com..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy trigger sent successfully."
